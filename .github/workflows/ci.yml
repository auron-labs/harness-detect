name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('packages/typescript/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile
        working-directory: packages/typescript

      - name: Validate registry schema and invariants
        run: node scripts/validate-registry.mjs

      - name: Summarize harness changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/summarize-harness-changes.mjs --base "$BASE_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Check registry drift
        run: bun scripts/sync-registry.mjs --check

      - name: Check support matrix drift
        run: node scripts/generate-support-matrix.mjs --check

      - name: Check Automd docs freshness
        run: node scripts/check-doc-stats.mjs

      - name: TypeScript tests
        run: bun test
        working-directory: packages/typescript

      - name: TypeScript dependency audit
        run: bun audit
        working-directory: packages/typescript

      - name: TypeScript typecheck
        run: bun run types:check
        working-directory: packages/typescript

      - name: TypeScript smoke fixtures
        run: bun run smoke:fixtures:local | tee smoke-output.txt
        working-directory: packages/typescript

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-output
          path: packages/typescript/smoke-output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: TypeScript pack dry-run
        run: bun pm pack --dry-run
        working-directory: packages/typescript

      - name: Check API parity
        run: bun scripts/check-api-parity.mjs

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/golang/go.mod
          cache: true

      - name: Go tests
        run: go test ./...
        working-directory: packages/golang

      - name: Go vet
        run: go vet ./...
        working-directory: packages/golang

      - name: Go external consumer check
        run: node scripts/check-go-consumer.mjs

      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
        working-directory: packages/golang

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/rust

      - name: Rust format check
        run: cargo fmt --check
        working-directory: packages/rust

      - name: Rust clippy
        run: cargo clippy --all-targets
        working-directory: packages/rust

      - name: Rust tests
        run: cargo test
        working-directory: packages/rust

      - name: Rust package validation
        run: cargo package --allow-dirty
        working-directory: packages/rust

      - name: Rust dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
        working-directory: packages/rust

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: packages/python/uv.lock

      - name: Install Python dependencies
        run: uv sync --dev --frozen
        working-directory: packages/python

      - name: Check package parity
        run: bun scripts/check-package-parity.mjs

      - name: Python lint
        run: uv run ruff check .
        working-directory: packages/python

      - name: Python format check
        run: uv run ruff format --check .
        working-directory: packages/python

      - name: Python tests
        run: uv run pytest
        working-directory: packages/python

      - name: Python package build
        run: uv build
        working-directory: packages/python

      - name: Python dependency audit
        run: uv run --with pip-audit pip-audit
        working-directory: packages/python
