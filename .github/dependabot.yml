version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: github-actions
    directory: /.github/workflows
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    labels:
      - dependencies
      - github-actions
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /packages/typescript
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    labels:
      - dependencies
      - typescript
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /packages/golang
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    labels:
      - dependencies
      - go
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /packages/rust
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    labels:
      - dependencies
      - rust
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /packages/python
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    labels:
      - dependencies
      - python
    cooldown:
      default-days: 7
