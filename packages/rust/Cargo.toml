[package]
name = "harness-detect"
version = "0.6.0"
edition = "2021"
description = "Detect installed LLM harnesses and resolve their config/state paths from an embedded JSON registry."
readme = "README.md"
repository = "https://github.com/auron-labs/harness-detect"
license = "MIT"
keywords = ["claude", "codex", "detect", "harness", "llm"]
categories = ["filesystem"]

[lib]
name = "harness_detect"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
