[project]
name = "harness-detect"
version = "0.5.0"
description = "Detect installed LLM harnesses and resolve their config/state paths from a JSON registry."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Auron" },
]
keywords = ["claude", "codex", "detect", "gemini", "harness", "llm"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Filesystems",
]

[project.urls]
Issues = "https://github.com/auron-labs/harness-detect/issues"
Repository = "https://github.com/auron-labs/harness-detect"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_detect"]

[tool.hatch.build.targets.wheel.force-include]
"src/harness_detect/data/harnesses.json" = "harness_detect/data/harnesses.json"
